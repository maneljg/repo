name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Triggered by cosmos-github-dispatcher via workflow_dispatch API.
  # Also allows manual trigger from the GitHub Actions web UI → Run workflow button.
  workflow_dispatch:
    inputs:
      correlationId:
        description: 'Correlation / execution ID (maps to executionid in CallbackDeploy)'
        required: false
        default: 'manual-test'
      componentName:
        description: 'Component name to deploy'
        required: false
        default: 'test-component'
      version:
        description: 'Component version'
        required: false
        default: '1.0.0'
      environment:
        description: 'Target environment (INTEGRATION, STAGING, PRODUCTION)'
        required: false
        default: 'INTEGRATION'
      stepNumber:
        description: 'Step number in the deploy plan'
        required: false
        default: '1'
      componentType:
        description: 'Component type'
        required: false
        default: 'KUBERNETES'
      queueType:
        description: 'Queue type'
        required: false
        default: 'GITHUB_KUBERNETES'
      step-callback-url:
        description: 'Full URL to POST the CallbackDeploy result to (e.g. https://xxx.ngrok.io/github-dispatcher/webhook/callback)'
        required: false
        default: ''

jobs:
  build:
    name: Build & print dispatch inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print dispatch inputs
        run: |
          echo "=== Dispatch Inputs received from cosmos-github-dispatcher ==="
          echo "correlationId     = ${{ github.event.inputs.correlationId }}"
          echo "componentName     = ${{ github.event.inputs.componentName }}"
          echo "version           = ${{ github.event.inputs.version }}"
          echo "environment       = ${{ github.event.inputs.environment }}"
          echo "stepNumber        = ${{ github.event.inputs.stepNumber }}"
          echo "componentType     = ${{ github.event.inputs.componentType }}"
          echo "queueType         = ${{ github.event.inputs.queueType }}"
          echo "step-callback-url = ${{ github.event.inputs.step-callback-url }}"
          echo "================================================================"

      - name: Run a one-line script
        run: echo Hello, world!

      # ── Callback to cosmos-github-dispatcher ──────────────────────────────
      # Sends a CallbackDeploy JSON to the step-callback-url input.
      # Authentication via SD-APIKEY header (stored as a GitHub Actions secret).
      # Runs always (success AND failure) so cosmos always gets notified.
      - name: Notify cosmos-github-dispatcher (webhook callback)
        if: always() && github.event.inputs.step-callback-url != ''
        env:
          COSMOS_SD_APIKEY: ${{ secrets.COSMOS_SD_APIKEY }}
        run: |
          # Determine jobStatus for CallbackDeploy
          if [ "${{ job.status }}" = "success" ]; then
            JOB_STATUS="SUCCESS"
          else
            JOB_STATUS="FAILURE"
          fi

          STEP_NUMBER=${{ github.event.inputs.stepNumber || '1' }}

          # Build the CallbackDeploy JSON payload.
          # Field names must match @JsonProperty values in CallbackDeploy (all lowercase).
          PAYLOAD=$(printf '{"executionid":"%s","stepnumber":%s,"deployedenvironment":"%s","deployedapplication":"%s","deployedversion":"%s","jobstatus":"%s","jobstatusdescription":"GitHub Actions workflow completed"}' \
            "${{ github.event.inputs.correlationId }}" \
            "$STEP_NUMBER" \
            "${{ github.event.inputs.environment || 'INTEGRATION' }}" \
            "${{ github.event.inputs.componentName || 'test-component' }}" \
            "${{ github.event.inputs.version || '1.0.0' }}" \
            "$JOB_STATUS")

          echo "Payload: $PAYLOAD"
          echo "Sending callback to ${{ github.event.inputs.step-callback-url }}"

          HTTP_STATUS=$(curl -s -o /tmp/cb_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "SD-APIKEY: $COSMOS_SD_APIKEY" \
            -d "$PAYLOAD" \
            "${{ github.event.inputs.step-callback-url }}")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/cb_response.txt

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "WARNING: Callback returned $HTTP_STATUS — cosmos may not have been notified"
            exit 1
          fi
