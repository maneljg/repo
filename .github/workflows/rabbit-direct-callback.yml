name: rabbit-direct-callback
on:
  workflow_dispatch:
    inputs:
      correlationId:
        description: 'Execution ID (correlationId)'
        required: true
        default: 'rabbit-test-001'
      deploymentPlanId:
        description: 'Deployment Plan ID'
        required: false
        default: 'plan-test-001'
      stepNumber:
        description: 'Step number'
        required: false
        default: '1'
      environment:
        description: 'Target environment (INTEGRATION, STAGING, PRODUCTION)'
        required: false
        default: 'INTEGRATION'
      componentName:
        description: 'Component name'
        required: false
        default: 'my-service'
      version:
        description: 'Version to deploy'
        required: false
        default: '1.0.0'
      jobStatus:
        description: 'Job status to report (SUCCESS, FAILURE)'
        required: false
        default: 'SUCCESS'
jobs:
  publish-to-rabbitmq:
    runs-on: ubuntu-latest
    steps:
      - name: Publish CallbackDeploy directly to RabbitMQ exchange.callback-deploy-step
        env:
          RABBITMQ_MGMT_URL: ${{ secrets.COSMOS_RABBITMQ_MGMT_URL }}
          RABBITMQ_USER: ${{ secrets.COSMOS_RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.COSMOS_RABBITMQ_PASS }}
        run: |
          set -e
          JOB_STATUS="${{ github.event.inputs.jobStatus }}"
          ROUTING_KEY="${JOB_STATUS}.COSMOS"
          TYPE_ID="com.verisure.ps2.cosmos.common.jenkinsevent.event.CallbackDeploy"
          EXCHANGE="exchange.callback-deploy-step"
          VHOST="cosmos"
          # Build the CallbackDeploy JSON using jq to ensure proper escaping
          CALLBACK_PAYLOAD=$(jq -n \
            --arg execId "${{ github.event.inputs.correlationId }}" \
            --arg planId "${{ github.event.inputs.deploymentPlanId }}" \
            --argjson step "${{ github.event.inputs.stepNumber }}" \
            --arg env "${{ github.event.inputs.environment }}" \
            --arg app "${{ github.event.inputs.componentName }}" \
            --arg ver "${{ github.event.inputs.version }}" \
            --arg status "$JOB_STATUS" \
            '{
              executionId: $execId,
              deploymentPlanId: $planId,
              stepNumber: $step,
              deployedEnvironment: $env,
              deployedApplication: $app,
              deployedVersion: $ver,
              jobStatus: $status,
              jobStatusDescription: "GitHub Actions workflow completed via direct RabbitMQ publish"
            }')
          echo "=== Publishing to RabbitMQ ==="
          echo "Exchange:    $EXCHANGE"
          echo "Routing key: $ROUTING_KEY"
          echo "Payload:"
          echo "$CALLBACK_PAYLOAD" | jq .
          echo ""
          # Build the RabbitMQ Management API publish body
          # payload must be a STRING (jq --arg encodes it as escaped JSON string)
          # __TypeId__ header is required for Spring AMQP Jackson2 deserialization
          PUBLISH_BODY=$(jq -n \
            --arg type_id "$TYPE_ID" \
            --arg routing_key "$ROUTING_KEY" \
            --arg payload "$CALLBACK_PAYLOAD" \
            '{
              properties: {
                content_type: "application/json",
                delivery_mode: 2,
                headers: { "__TypeId__": $type_id }
              },
              routing_key: $routing_key,
              payload: $payload,
              payload_encoding: "string"
            }')
          # POST to RabbitMQ Management HTTP API
          # vhost "cosmos" and exchange name with dots need URL encoding
          ENCODED_VHOST=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$VHOST', safe=''))")
          ENCODED_EXCHANGE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$EXCHANGE', safe=''))")
          PUBLISH_URL="${RABBITMQ_MGMT_URL}/api/exchanges/${ENCODED_VHOST}/${ENCODED_EXCHANGE}/publish"
          echo "=== Calling: ${RABBITMQ_MGMT_URL}/api/exchanges/${VHOST}/${EXCHANGE}/publish"
          HTTP_STATUS=$(curl -s -o /tmp/rabbit_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -u "${RABBITMQ_USER}:${RABBITMQ_PASS}" \
            -d "$PUBLISH_BODY" \
            "$PUBLISH_URL")
          echo "HTTP status: $HTTP_STATUS"
          echo "Response:    $(cat /tmp/rabbit_response.txt)"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Failed to publish to RabbitMQ (HTTP $HTTP_STATUS)"
            exit 1
          fi
          ROUTED=$(cat /tmp/rabbit_response.txt | jq -r '.routed')
          echo "routed=$ROUTED"
          if [ "$ROUTED" = "false" ]; then
            echo "WARNING: Message was not routed to any queue (no bindings matched routing key '$ROUTING_KEY')"
          else
            echo "=== SUCCESS: Message published to exchange '$EXCHANGE' with routing key '$ROUTING_KEY' ==="
          fi